services:
  flowme-lp:
    container_name: flowme-lp
    restart: unless-stopped
    image: ${FLOWME_LP_IMAGE:-ghcr.io/victorrayan/flowme-lp:latest}
    build:
      context: ./flowme-lp
      dockerfile: Dockerfile
    labels:
      - traefik.enable=true
      - traefik.docker.network=flowme-proxy
      - traefik.http.routers.flowme-lp.rule=Host(`${FLOWME_LP_DOMAIN}`)
      - traefik.http.routers.flowme-lp.entrypoints=websecure
      - traefik.http.routers.flowme-lp.tls=true
      - traefik.http.routers.flowme-lp.tls.certresolver=letsencrypt
      - traefik.http.services.flowme-lp.loadbalancer.server.port=80
      - traefik.http.services.flowme-lp.loadbalancer.passhostheader=true
    networks:
      - flowme-proxy

networks:
  flowme-proxy:
    external: true
