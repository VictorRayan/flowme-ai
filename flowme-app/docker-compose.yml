services:
  flowme-app:
    container_name: flowme-app
    restart: unless-stopped
    image: ${FLOWME_APP_IMAGE:-ghcr.io/victorrayan/flowme-app:latest}
    build:
      context: ./flowme-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_WHATSAPP_INSTANCE_DISPLAY_NUMBER: ${NEXT_PUBLIC_WHATSAPP_INSTANCE_DISPLAY_NUMBER}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID}
      META_PIXEL_ID: ${META_PIXEL_ID}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      STRIPE_PRO_MONTHLY_PRICE_ID: ${STRIPE_PRO_MONTHLY_PRICE_ID}
      STRIPE_PRO_ANNUAL_PRICE_ID: ${STRIPE_PRO_ANNUAL_PRICE_ID}
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASAAS_API_URL: ${ASAAS_API_URL}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN}
      IPINFO_TOKEN: ${IPINFO_TOKEN}
      IPINFO_API_URL: ${IPINFO_API_URL:-https://api.ipinfo.io/lite}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID}
      APPLE_ISSUER_ID: ${APPLE_ISSUER_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_PRIVATE_KEY_BASE64: ${APPLE_PRIVATE_KEY_BASE64}
      APPLE_ROOT_CA_BASE64: ${APPLE_ROOT_CA_BASE64}
      APPLE_PRO_MONTHLY_PRODUCT_ID: ${APPLE_PRO_MONTHLY_PRODUCT_ID}
      APPLE_PRO_ANNUAL_PRODUCT_ID: ${APPLE_PRO_ANNUAL_PRODUCT_ID}
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64}
      GOOGLE_PLAY_PRO_MONTHLY_PRODUCT_ID: ${GOOGLE_PLAY_PRO_MONTHLY_PRODUCT_ID}
      GOOGLE_PLAY_PRO_ANNUAL_PRODUCT_ID: ${GOOGLE_PLAY_PRO_ANNUAL_PRODUCT_ID}
      GOOGLE_PLAY_WEBHOOK_TOKEN: ${GOOGLE_PLAY_WEBHOOK_TOKEN}
      APNS_KEY_ID: ${APNS_KEY_ID}
      APNS_TEAM_ID: ${APNS_TEAM_ID}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID}
      APNS_USE_SANDBOX: ${APNS_USE_SANDBOX:-false}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY}
      BILLING_ADMIN_USER_IDS: ${BILLING_ADMIN_USER_IDS}
      DAILY_AI_COST_ALERT_USD: ${DAILY_AI_COST_ALERT_USD:-5}
      BALYS_PRO_REQUESTS_PER_MINUTE: ${BALYS_PRO_REQUESTS_PER_MINUTE:-30}
      BALYS_PRO_EXPENSIVE_CONCURRENCY: ${BALYS_PRO_EXPENSIVE_CONCURRENCY:-2}
      BALYS_PRO_EXPENSIVE_LEASE_SECONDS: ${BALYS_PRO_EXPENSIVE_LEASE_SECONDS:-900}
      BALYS_PRO_IMAGE_GENERATION_DAILY_LIMIT: ${BALYS_PRO_IMAGE_GENERATION_DAILY_LIMIT:-10}
      BALYS_PRO_COUNCIL_DAILY_LIMIT: ${BALYS_PRO_COUNCIL_DAILY_LIMIT:-10}
      BALYS_PRO_WEB_GROUNDED_DAILY_LIMIT: ${BALYS_PRO_WEB_GROUNDED_DAILY_LIMIT:-30}
      BALYS_PRO_CONNECTOR_READ_DAILY_LIMIT: ${BALYS_PRO_CONNECTOR_READ_DAILY_LIMIT:-100}
      BALYS_PRO_BALYS_TOOL_DAILY_LIMIT: ${BALYS_PRO_BALYS_TOOL_DAILY_LIMIT:-100}
      BALYS_PRO_MEETING_DAILY_LIMIT: ${BALYS_PRO_MEETING_DAILY_LIMIT:-5}
      BALYS_PRO_REVIEW_DAILY_LIMIT: ${BALYS_PRO_REVIEW_DAILY_LIMIT:-6}
      BALYS_PRO_BRIEFING_DAILY_LIMIT: ${BALYS_PRO_BRIEFING_DAILY_LIMIT:-6}
      BALYS_ENABLE_GROK_CHAT: ${BALYS_ENABLE_GROK_CHAT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      CRON_SECRET: ${CRON_SECRET}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET}
      NEXT_PUBLIC_WHATSAPP_INSTANCE_DISPLAY_NUMBER: ${NEXT_PUBLIC_WHATSAPP_INSTANCE_DISPLAY_NUMBER}
    labels:
      - traefik.enable=true
      - traefik.docker.network=flowme-proxy
      - traefik.http.routers.flowme-app.rule=Host(`${FLOWME_APP_DOMAIN}`)
      - traefik.http.routers.flowme-app.entrypoints=websecure
      - traefik.http.routers.flowme-app.tls=true
      - traefik.http.routers.flowme-app.tls.certresolver=letsencrypt
      - traefik.http.services.flowme-app.loadbalancer.server.port=3000
      - traefik.http.services.flowme-app.loadbalancer.passhostheader=true
    networks:
      - flowme-proxy

  flowme-cron:
    container_name: flowme-cron
    restart: unless-stopped
    image: curlimages/curl:8.10.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        LAST_DAILY=""
        LAST_CONNECTORS_SLOT=""
        TICK=0
        while true; do
          # Briefings scheduler — fires on every minute, the endpoint short-circuits if no slot is due.
          curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] briefings-run %{http_code}\n" \
            -H "Authorization: Bearer $$CRON_SECRET" \
            http://flowme-app:3000/api/briefings/run || true
          curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] send-ritual-prompts %{http_code}\n" \
            -H "Authorization: Bearer $$CRON_SECRET" \
            http://flowme-app:3000/api/cron/send-ritual-prompts || true
          curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] generate-weekly-reviews %{http_code}\n" \
            -H "Authorization: Bearer $$CRON_SECRET" \
            http://flowme-app:3000/api/cron/generate-weekly-reviews || true
          curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] generate-monthly-reviews %{http_code}\n" \
            -H "Authorization: Bearer $$CRON_SECRET" \
            http://flowme-app:3000/api/cron/generate-monthly-reviews || true
          curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] deliver-billing-notifications %{http_code}\n" \
            -H "Authorization: Bearer $$CRON_SECRET" \
            http://flowme-app:3000/api/cron/deliver-billing-notifications || true
          # Meeting pipeline — runs every minute. The endpoint short-circuits
          # when no meeting is in `processing` or `reanalyzing`.
          curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] process-meetings %{http_code}\n" \
            -H "Authorization: Bearer $$CRON_SECRET" \
            -X POST \
            http://flowme-app:3000/api/cron/process-meetings || true
          # Reminders every 5 minutes (TICK runs 0..4).
          if [ "$$TICK" = "0" ]; then
            curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] materialize-calendar-reminders %{http_code}\n" \
              -H "Authorization: Bearer $$CRON_SECRET" \
              http://flowme-app:3000/api/cron/materialize-calendar-reminders || true
            curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] send-event-checkins %{http_code}\n" \
              -H "Authorization: Bearer $$CRON_SECRET" \
              http://flowme-app:3000/api/cron/send-event-checkins || true
            curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] send-reminders %{http_code}\n" \
              -H "Authorization: Bearer $$CRON_SECRET" \
              http://flowme-app:3000/api/cron/send-reminders || true
          fi
          TODAY=$$(date -u +%Y-%m-%d)
          HOUR=$$(date -u +%H)
          CONNECTORS_SLOT="$${TODAY}T$${HOUR}"
          if { [ "$$HOUR" = "00" ] || [ "$$HOUR" = "06" ] || [ "$$HOUR" = "12" ] || [ "$$HOUR" = "18" ]; } && [ "$$LAST_CONNECTORS_SLOT" != "$$CONNECTORS_SLOT" ]; then
            curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] check-connectors %{http_code}\n" \
              -H "Authorization: Bearer $$CRON_SECRET" \
              http://flowme-app:3000/api/cron/check-connectors || true
            LAST_CONNECTORS_SLOT="$$CONNECTORS_SLOT"
          fi
          if [ "$$HOUR" = "04" ] && [ "$$LAST_DAILY" != "$$TODAY" ]; then
            curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] reconcile-billing %{http_code}\n" \
              -H "Authorization: Bearer $$CRON_SECRET" \
              http://flowme-app:3000/api/cron/reconcile-billing || true
            curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] summarize-stale-threads %{http_code}\n" \
              -H "Authorization: Bearer $$CRON_SECRET" \
              http://flowme-app:3000/api/cron/summarize-stale-threads || true
            LAST_DAILY="$$TODAY"
          fi
          TICK=$$(( (TICK + 1) % 5 ))
          sleep 60
        done
    environment:
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      - flowme-app
    networks:
      - flowme-proxy

networks:
  flowme-proxy:
    external: true
