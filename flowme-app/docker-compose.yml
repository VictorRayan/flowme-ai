services:
  flowme-app:
    container_name: flowme-app
    restart: unless-stopped
    build:
      context: ./flowme-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_WHATSAPP_INSTANCE_DISPLAY_NUMBER: ${NEXT_PUBLIC_WHATSAPP_INSTANCE_DISPLAY_NUMBER}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      BALYS_ENABLE_GROK_CHAT: ${BALYS_ENABLE_GROK_CHAT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      CRON_SECRET: ${CRON_SECRET}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET}
      NEXT_PUBLIC_WHATSAPP_INSTANCE_DISPLAY_NUMBER: ${NEXT_PUBLIC_WHATSAPP_INSTANCE_DISPLAY_NUMBER}
    labels:
      - traefik.enable=true
      - traefik.docker.network=flowme-proxy
      - traefik.http.routers.flowme-app.rule=Host(`${FLOWME_APP_DOMAIN}`)
      - traefik.http.routers.flowme-app.entrypoints=websecure
      - traefik.http.routers.flowme-app.tls=true
      - traefik.http.routers.flowme-app.tls.certresolver=letsencrypt
      - traefik.http.services.flowme-app.loadbalancer.server.port=3000
      - traefik.http.services.flowme-app.loadbalancer.passhostheader=true
    networks:
      - flowme-proxy

  flowme-cron:
    container_name: flowme-cron
    restart: unless-stopped
    image: curlimages/curl:8.10.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        LAST_DAILY=""
        TICK=0
        while true; do
          # Briefings scheduler — fires on every minute, the endpoint short-circuits if no slot is due.
          curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] briefings-run %{http_code}\n" \
            -H "Authorization: Bearer $$CRON_SECRET" \
            http://flowme-app:3000/api/briefings/run || true
          # Reminders every 5 minutes (TICK runs 0..4).
          if [ "$$TICK" = "0" ]; then
            curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] send-reminders %{http_code}\n" \
              -H "Authorization: Bearer $$CRON_SECRET" \
              http://flowme-app:3000/api/cron/send-reminders || true
          fi
          TODAY=$$(date -u +%Y-%m-%d)
          HOUR=$$(date -u +%H)
          if [ "$$HOUR" = "04" ] && [ "$$LAST_DAILY" != "$$TODAY" ]; then
            curl -sS -o /dev/null -w "[$$(date -u +%FT%TZ)] summarize-stale-threads %{http_code}\n" \
              -H "Authorization: Bearer $$CRON_SECRET" \
              http://flowme-app:3000/api/cron/summarize-stale-threads || true
            LAST_DAILY="$$TODAY"
          fi
          TICK=$$(( (TICK + 1) % 5 ))
          sleep 60
        done
    environment:
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      - flowme-app
    networks:
      - flowme-proxy

networks:
  flowme-proxy:
    external: true
